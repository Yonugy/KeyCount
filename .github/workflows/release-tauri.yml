name: release-tauri

# Builds the KeyCount desktop agent (tauri/) into installers and attaches
# them to a GitHub Release when a version tag is pushed:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Output files, named after the tag:
#   KeyCount_v0.2.0.exe   Windows installer
#   KeyCount_v0.2.0.dmg   macOS installer (Apple silicon and Intel in one)
#
# The release is created as a pre-release. Untick "pre-release" on GitHub
# once it has been tested, which makes it the latest release.
#
# Running it by hand from the Actions tab builds the same installers but
# does not create a release. The files are kept as a workflow artifact
# instead, which GitHub wraps in a zip for download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_targets: ""
            bundle: nsis
            ext: exe
            args: "--bundles nsis"
          - os: macos-latest
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            bundle: dmg
            ext: dmg
            args: "--target universal-apple-darwin --bundles dmg"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Run tests
        working-directory: tauri/src-tauri
        run: cargo test --lib

      # No tagName here on purpose: tauri-action only builds. Publishing
      # happens below so the installer can be renamed first.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }}

      - name: Name the installer
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          src=$(find tauri/src-tauri/target -path "*/bundle/${{ matrix.bundle }}/*.${{ matrix.ext }}" | head -n 1)
          test -n "$src" || { echo "No ${{ matrix.ext }} installer found"; exit 1; }
          cp "$src" "KeyCount_${{ github.ref_name }}.${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: KeyCount-${{ matrix.ext }}
          path: KeyCount_${{ github.ref_name }}.${{ matrix.ext }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: KeyCount ${{ github.ref_name }}
          prerelease: true
          files: KeyCount_${{ github.ref_name }}.${{ matrix.ext }}
